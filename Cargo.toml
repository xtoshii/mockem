[package]
name = "mockem2"
version = "0.2.5"
edition = "2021"
authors = ["xtoshii <2548427264@qq.com>"]
description = "mock'em functions!"
categories = ["development-tools::testing"]
keywords = ["testing", "mock", "mocking", "derive"]
documentation = "https://docs.rs/mockem2"
repository = "https://github.com/xtoshii/mockem"
license = "MIT OR Apache-2.0"
rust-version = "1.56"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
mockem2-derive = { version = "0.3.0", path = "derive" }

[dev-dependencies]
async-trait = { version = "0.1" }
tokio = { version = "1", features = ["test-util", "macros"]}
tracing = { version = "0.1" }
