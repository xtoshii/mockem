[package]
name = "mockem2-derive"
version = "0.3.0"
edition = "2021"
authors = ["xtoshii <2548427264@qq.com>"]
description = "derive for mockem"
categories = ["development-tools::testing"]
keywords = ["testing", "mock", "mocking", "derive"]
documentation = "https://docs.rs/mockem2"
repository = "https://github.com/xtoshii/mockem"
license = "MIT OR Apache-2.0"
rust-version = "1.56"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

